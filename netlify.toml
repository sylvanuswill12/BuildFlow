[build]
  command = "pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_USE_PNPM = "true"
  PNPM_VERSION = "10.18.0"

[functions]
  node_bundler = "esbuild"
  included_files = ["drizzle/**", "shared/**"]

# The function receives the original /api/... path so Express and tRPC keep their routes.
[[redirects]]
  from = "/api/*"
  force = true
  to = "/.netlify/functions/api/:splat"
  status = 200

# Let the Vite SPA handle client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
